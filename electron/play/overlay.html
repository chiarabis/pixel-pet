<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Giochiamo</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        /* quasi invisibile ma non del tutto: un pixel con alpha 0 non riceve i click */
        background: rgb(0 0 0 / 1%);
        cursor: crosshair;
      }

      .hint {
        position: fixed;
        top: 24px;
        left: 50%;
        translate: -50% 0;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgb(30 27 45 / 85%);
        color: #fff;
        font: 14px system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="hint">Clicca dove vuoi che vada · Esc per annullare</div>

    <script>
      window.addEventListener("pointerdown", (event) => {
        if (event.button === 0) window.overlayAPI.pick();
        else window.overlayAPI.cancel();
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") window.overlayAPI.cancel();
      });
      window.addEventListener("contextmenu", (event) => event.preventDefault());
    </script>
  </body>
</html>
