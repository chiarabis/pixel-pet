<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src file:; img-src file:"
    />
    <title>Giochiamo</title>
    <style>
      @font-face {
        font-family: "VT323";
        src: url("../fonts/VT323-Regular.ttf") format("truetype");
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        user-select: none;
        /* quasi invisibile ma non del tutto: un pixel con alpha 0 non riceve i click */
        background: rgb(0 0 0 / 1%);
        cursor: crosshair;
      }

      .hint {
        position: fixed;
        top: 24px;
        left: 50%;
        translate: -50% 0;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgb(30 27 45 / 85%);
        color: #fff;
        font: 20px "VT323", system-ui, sans-serif;
        pointer-events: none;
      }

      .ball {
        position: fixed;
        top: -10px;
        left: -10px;
        display: none;
        pointer-events: none;
      }

      .ball img {
        display: block;
        width: 24px;
        height: 24px;
        image-rendering: pixelated;
        animation: ball-spin 6s linear infinite;
      }

      @keyframes ball-spin {
        to {
          rotate: 360deg;
        }
      }
    </style>
  </head>
  <body>
    <div class="hint">Clicca dove vuoi che vada · Esc per annullare</div>

    <div class="ball" id="ball"><img src="palla.png" alt="ball" draggable="false" /></div>

    <script>
      const BALL_OFFSET = 14;
      const ball = document.getElementById("ball");

      window.addEventListener("pointermove", (event) => {
        ball.style.display = "block";
        ball.style.translate = `${event.clientX + BALL_OFFSET}px ${event.clientY + BALL_OFFSET}px`;
      });
      document.addEventListener("pointerleave", () => {
        ball.style.display = "none";
      });

      window.addEventListener("pointerdown", (event) => {
        if (event.button === 0) window.overlayAPI.pick();
        else window.overlayAPI.cancel();
      });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") window.overlayAPI.cancel();
      });
      window.addEventListener("contextmenu", (event) => event.preventDefault());
    </script>
  </body>
</html>
