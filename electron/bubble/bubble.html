<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Fumetto</title>
    <style>
      :root {
        --ink: #49415f;
        --paper: #fff;
        --tail-x: 120px;
      }

      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
        font: 14px/1.3 system-ui, sans-serif;
        color: var(--ink);
      }

      /* il padding lascia spazio alla X, che sporge dall'angolo del fumetto */
      #wrap {
        display: inline-block;
        position: relative;
        padding: 10px;
        width: fit-content;
      }

      .bubble {
        position: relative;
        box-sizing: border-box;
        min-width: 110px;
        max-width: 200px;
        padding: 10px;
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 14px;
        text-align: center;
        overflow-wrap: anywhere;
      }

      /* punta del fumetto verso il pet */
      .tail {
        position: relative;
        left: calc(var(--tail-x) - 10px - 8px);
        top: -2px;
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 10px solid var(--ink);
      }

      .tail::after {
        content: "";
        position: absolute;
        left: -5px;
        top: -12px;
        border-left: 5px solid transparent;
        border-right: 5px solid transparent;
        border-top: 8px solid var(--paper);
      }

      .close {
        display: none;
        position: absolute;
        top: -9px;
        right: -9px;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: var(--paper);
        color: var(--ink);
        font: bold 12px/1 system-ui, sans-serif;
        cursor: pointer;
      }

      .close:hover {
        background: #f28ab3;
      }

      #wrap.show:hover .close {
        display: block;
      }

      input {
        box-sizing: border-box;
        padding: 4px 6px;
        border: 2px solid var(--ink);
        border-radius: 8px;
        font: inherit;
        color: var(--ink);
        outline: none;
        user-select: text;
      }

      .hint {
        margin-top: 6px;
        font-size: 11px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div class="bubble" id="bubble"></div>
      <div class="tail"></div>
    </div>

    <script>
      const wrap = document.getElementById("wrap");
      const bubble = document.getElementById("bubble");

      function reportSize() {
        const rect = wrap.getBoundingClientRect();
        window.bubbleAPI.resize(Math.ceil(rect.width), Math.ceil(rect.height));
      }

      function renderShow(text) {
        wrap.className = "show";
        bubble.textContent = text;

        const close = document.createElement("button");
        close.className = "close";
        close.type = "button";
        close.title = "Togli il fumetto";
        close.textContent = "✕";
        close.addEventListener("click", () => window.bubbleAPI.close());
        bubble.appendChild(close);
      }

      function renderInput(text, maxWords) {
        wrap.className = "input";
        bubble.textContent = "";

        const input = document.createElement("input");
        input.type = "text";
        input.maxLength = 80;
        input.placeholder = "Cosa devo dire?";
        input.value = text || "";

        const hint = document.createElement("div");
        hint.className = "hint";

        function countWords() {
          const trimmed = input.value.trim();
          return trimmed ? trimmed.split(/\s+/) : [];
        }

        function updateHint() {
          hint.textContent = `${countWords().length}/${maxWords} parole · Invio · Esc`;
        }

        input.addEventListener("input", () => {
          const words = countWords();
          // oltre il limite le parole in più vengono tolte
          if (words.length > maxWords) input.value = words.slice(0, maxWords).join(" ");
          updateHint();
        });

        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            const words = countWords().slice(0, maxWords);
            if (words.length > 0) window.bubbleAPI.submit(words.join(" "));
          } else if (event.key === "Escape") {
            window.bubbleAPI.cancel();
          }
        });

        bubble.append(input, hint);
        updateHint();
        input.focus();
        input.select();
      }

      window.bubbleAPI.onMode(({ mode, text, maxWords }) => {
        if (mode === "input") renderInput(text, maxWords);
        else renderShow(text);

        // finestra della misura esatta del fumetto: così non intercetta click inutili.
        // Niente requestAnimationFrame: si ferma quando la finestra è nascosta.
        reportSize();
      });

      window.bubbleAPI.onTail((x) => {
        const rect = wrap.getBoundingClientRect();
        // la punta resta dentro il fumetto anche quando questo è spinto contro il bordo dello schermo
        const clamped = Math.min(Math.max(x, 28), Math.max(28, rect.width - 28));
        document.documentElement.style.setProperty("--tail-x", `${clamped}px`);
      });

      wrap.addEventListener("mouseenter", () => {
        if (wrap.className === "show") window.bubbleAPI.hover(true);
      });
      wrap.addEventListener("mouseleave", () => {
        if (wrap.className === "show") window.bubbleAPI.hover(false);
      });
    </script>
  </body>
</html>
