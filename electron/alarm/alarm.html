<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src file:"
    />
    <title>Sveglia · Pixel Pet</title>
    <style>
      @font-face {
        font-family: "VT323";
        src: url("../fonts/VT323-Regular.ttf") format("truetype");
      }

      :root {
        --ink: #49415f;
        --paper: #fbf9ff;
        --accent: #f28ab3;
      }

      body {
        margin: 0;
        padding: 20px 24px;
        background: var(--paper);
        color: var(--ink);
        font: 20px/1.2 "VT323", system-ui, sans-serif;
        user-select: none;
      }

      h2 {
        margin: 18px 0 8px;
        font-size: 24px;
        font-weight: 400;
      }

      p {
        margin: 4px 0;
      }

      .note {
        opacity: 0.75;
        font-size: 18px;
      }

      .switch {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        font-size: 24px;
        cursor: pointer;
      }

      /* la casella vera resta nella pagina (tastiera e lettori di schermo) ma non si vede: si vede .track */
      .switch input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: 0;
        opacity: 0;
      }

      /* interruttore pixel: il quadrato scorre da un lato all'altro, con il testo OFF / ON dal lato opposto */
      .track {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex: none;
        box-sizing: border-box;
        width: 76px;
        height: 28px;
        margin: 2px;
        padding: 0 8px;
        background: #fff;
        color: var(--ink);
        font-size: 20px;
        box-shadow:
          0 -2px 0 0 var(--ink),
          0 2px 0 0 var(--ink),
          -2px 0 0 0 var(--ink),
          2px 0 0 0 var(--ink);
      }

      .track::before {
        content: "";
        position: absolute;
        top: 4px;
        left: 4px;
        width: 20px;
        height: 20px;
        background: var(--ink);
        transition: left 0.12s steps(3);
      }

      .track::after {
        content: "OFF";
      }

      .switch input:checked ~ .track {
        justify-content: flex-start;
        background: var(--accent);
      }

      .switch input:checked ~ .track::before {
        left: calc(100% - 24px);
      }

      .switch input:checked ~ .track::after {
        content: "ON";
      }

      .switch:hover .track {
        filter: brightness(0.96);
      }

      .switch input:focus-visible ~ .track {
        outline: 2px dashed var(--ink);
        outline-offset: 5px;
      }

      @media (prefers-reduced-motion: reduce) {
        .track::before {
          transition: none;
        }
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      /* orario, tipo e X stanno su una riga */
      li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        margin: 8px 2px;
      }

      [hidden] {
        display: none !important;
      }

      /* il tipo di pausa: una tendina larga sempre uguale, così la X resta incolonnata */
      .kind {
        position: relative;
        flex: none;
        width: 220px;
        margin: 2px;
      }

      .kind select {
        width: 100%;
        margin: 0;
      }

      .kind.custom input[type="text"] {
        position: absolute;
        top: 2px;
        bottom: 2px;
        left: 2px;
        right: 30px;
        box-sizing: border-box;
        width: auto;
        margin: 0;
        padding: 0 8px;
        box-shadow: none;
        background: #fff;
      }

      input[type="text"]::placeholder {
        color: var(--ink);
        opacity: 0.45;
      }

      option {
        color: var(--ink);
        background: #fff;
      }

      /* bordo "pixel" come nel fumetto: quattro ombre piene, senza sfocatura */
      input[type="time"],
      input[type="text"],
      select,
      button {
        font: 22px/1 "VT323", system-ui, sans-serif;
        color: var(--ink);
        border: 0;
        margin: 2px;
        padding: 6px 10px;
        box-shadow:
          0 -2px 0 0 var(--ink),
          0 2px 0 0 var(--ink),
          -2px 0 0 0 var(--ink),
          2px 0 0 0 var(--ink);
        background: #fff;
        outline: none;
      }

      input[type="time"],
      input[type="text"] {
        user-select: text;
      }

      /* sopra l'orario si scrive: cursore di testo, non la manina (che resta sull'icona dell'orologio) */
      input[type="time"],
      input[type="time"]::-webkit-datetime-edit,
      input[type="time"]::-webkit-datetime-edit-fields-wrapper,
      input[type="time"]::-webkit-datetime-edit-hour-field,
      input[type="time"]::-webkit-datetime-edit-minute-field,
      input[type="time"]::-webkit-datetime-edit-text,
      input[type="text"] {
        cursor: text;
      }

      input[type="time"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
      }

      select {
        cursor: pointer;
      }

      button {
        background: var(--ink);
        color: #fff;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        background: var(--accent);
        color: var(--ink);
      }

      .remove {
        padding: 6px 10px 4px;
      }

      .empty {
        margin: 8px 2px;
        opacity: 0.6;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 18px;
      }

      /* larghezza fissa: "Salvato" è più lungo di "Salva" e il tasto non deve spostare il testo accanto */
      #save {
        min-width: 100px;
      }

      #save.saved {
        background: var(--accent);
        color: var(--ink);
      }

      #message {
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <label class="switch">
      <input type="checkbox" id="enabled" role="switch" />
      <span>Modalità sveglia</span>
      <span class="track" aria-hidden="true"></span>
    </label>

    <h2>Pause</h2>
    <ul id="list"></ul>
    <p class="empty" id="empty">Nessun orario: aggiungine uno.</p>
    <button type="button" id="add">+ Aggiungi orario</button>

    <div class="actions">
      <button type="button" id="save">Salva</button>
      <span id="message"></span>
    </div>

    <script>
      const enabled = document.getElementById("enabled");
      const list = document.getElementById("list");
      const empty = document.getElementById("empty");
      const message = document.getElementById("message");
      const saveButton = document.getElementById("save");

      // il tasto dice se gli orari che si vedono sono quelli salvati: "Salvato" finché non si cambia qualcosa
      function markSaved() {
        saveButton.textContent = "Salvato";
        saveButton.classList.add("saved");
      }

      function markDirty() {
        saveButton.textContent = "Salva";
        saveButton.classList.remove("saved");
      }

      const MAX_ROWS = 12;
      const DEFAULT_TIME = "12:30";

      // i tipi di pausa arrivano dal main (schedule.js), insieme alla lunghezza massima del testo libero
      let kinds = [];
      let maxCustomText = 24;

      function updateEmpty() {
        empty.style.display = list.children.length === 0 ? "block" : "none";
      }

      // una riga: orario, tipo (menu a tendina), X per toglierla e, solo per "Testo mio", il testo del fumetto
      function addRow(item) {
        const row = document.createElement("li");

        const input = document.createElement("input");
        input.type = "time";
        input.value = item.time;
        input.required = true;
        input.setAttribute("aria-label", "Orario della pausa");

        const select = document.createElement("select");
        select.setAttribute("aria-label", "Tipo di pausa");
        for (const { kind, label } of kinds) {
          const option = document.createElement("option");
          option.value = kind;
          option.textContent = label;
          select.append(option);
        }
        select.value = item.kind;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.title = "Togli questo orario";
        remove.setAttribute("aria-label", "Togli questo orario");
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          row.remove();
          updateEmpty();
          markDirty();
        });

        // il testo del fumetto: c'è sempre, ma si vede solo con "Testo mio", sovrapposto alla tendina
        const text = document.createElement("input");
        text.type = "text";
        text.maxLength = maxCustomText;
        text.placeholder = "Scrivi...";
        text.value = item.text ?? "";
        text.setAttribute("aria-label", "Testo del fumetto");

        const kind = document.createElement("div");
        kind.className = "kind";

        function showKind() {
          const custom = select.value === "custom";

          kind.classList.toggle("custom", custom);
          text.hidden = !custom;
        }

        select.addEventListener("change", () => {
          showKind();
          if (select.value === "custom") text.focus();
        });

        showKind();

        kind.append(select, text);
        row.append(input, kind, remove);
        list.append(row);
        updateEmpty();
        return input;
      }

      // ciò che l'utente ha scritto nelle righe, nel formato che il main salva
      function readRows() {
        return [...list.children]
          .map((row) => {
            const kind = row.querySelector("select").value;
            const item = { time: row.querySelector('input[type="time"]').value, kind };
            if (kind === "custom") item.text = row.querySelector('input[type="text"]').value;
            return item;
          })
          .filter((item) => item.time);
      }

      // il nuovo orario parte tre ore dopo l'ultimo, così non resta uguale a uno già presente
      function nextTime() {
        const values = [...list.querySelectorAll('input[type="time"]')].map((input) => input.value).filter(Boolean).sort();
        if (values.length === 0) return DEFAULT_TIME;

        const [hours, minutes] = values[values.length - 1].split(":").map(Number);
        return `${String((hours + 3) % 24).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
      }

      document.getElementById("add").addEventListener("click", () => {
        if (list.children.length >= MAX_ROWS) {
          message.textContent = `Al massimo ${MAX_ROWS} orari.`;
          return;
        }

        message.textContent = "";
        addRow({ time: nextTime(), kind: "coffee" }).focus();
        markDirty();
      });

      // qualsiasi modifica a un orario, a un tipo o a un testo: gli orari non sono più quelli salvati
      list.addEventListener("input", markDirty);
      list.addEventListener("change", markDirty);

      // il toggle vale subito; gli orari invece si salvano con "Salva"
      enabled.addEventListener("change", async () => {
        const state = await window.alarmAPI.setEnabled(enabled.checked);

        enabled.checked = state.enabled;
        message.textContent = !state.enabled
          ? "Sveglia spenta."
          : state.breaks.length === 0
            ? "Sveglia accesa: aggiungi un orario e premi Salva."
            : "Sveglia accesa.";
      });

      document.getElementById("save").addEventListener("click", async () => {
        const saved = await window.alarmAPI.save({
          enabled: enabled.checked,
          breaks: readRows(),
        });

        list.textContent = "";
        saved.breaks.forEach(addRow);
        updateEmpty();

        markSaved();
        message.textContent = saved.enabled ? "Sveglia accesa." : "Sveglia spenta.";
      });

      window.alarmAPI.get().then((state) => {
        kinds = state.kinds;
        maxCustomText = state.maxCustomText;
        enabled.checked = state.enabled;
        state.breaks.forEach(addRow);
        updateEmpty();
      });
    </script>
  </body>
</html>
